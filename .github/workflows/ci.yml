name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  fitness:
    name: "shinobi-plugin-fitness — build + test + bundle up to date"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      # The catalog installs standalone/ straight from main: it must match src/.
      - run: npm run bundle && git diff --exit-code -- standalone/

  music:
    name: "shinobi-plugin-music — test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  adguard:
    name: "shinobi-plugin-adguard — test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  remember:
    name: "shinobi-plugin-remember — test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remember
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  minecraft:
    name: "shinobi-plugin-minecraft — test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
